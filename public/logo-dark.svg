<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="greenGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Left Logo Mark (S Emblem) -->
  <g transform="translate(40, 80) scale(1.8)">
    <!-- Blue Upper Ribbon -->
    <path
      d="M 75 22 C 50 22 26 30 26 50 C 26 62 36 72 50 82 L 62 90 C 72 96 82 98 82 90 C 82 82 72 74 62 66 C 50 56 42 48 42 38 C 42 30 54 28 68 28 C 76 28 85 30 85 22 Z"
      fill="url(#blueGradDark)"
    />
    <circle cx="48" cy="38" r="9" fill="url(#blueGradDark)" />

    <!-- Green Lower Ribbon -->
    <path
      d="M 45 98 C 70 98 94 90 94 70 C 94 58 84 48 70 38 L 58 30 C 48 24 38 22 38 30 C 38 38 48 46 58 54 C 70 64 78 72 78 82 C 78 90 66 92 52 92 C 44 92 35 90 35 98 Z"
      fill="url(#greenGradDark)"
    />
    <circle cx="72" cy="82" r="9" fill="url(#greenGradDark)" />

    <!-- Checkmark -->
    <path
      d="M 50 59 L 57 66 L 70 51"
      stroke="#34D399"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Typography -->
  <text x="270" y="180" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" letter-spacing="-2">Sessão</text>
  <text x="270" y="255" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="76" fill="#34D399" letter-spacing="-2">Certa</text>

  <!-- Tagline Dividers & Text -->
  <line x1="250" y1="305" x2="285" y2="305" stroke="#475569" stroke-width="2" />
  <text x="300" y="310" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="20" fill="#94A3B8" letter-spacing="0.5">Tecnologia que organiza o cuidado humano</text>
  <line x1="565" y1="305" x2="600" y2="305" stroke="#475569" stroke-width="2" />
</svg>
